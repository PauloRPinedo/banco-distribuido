[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banco-distribuido"
version = "0.1.0"
description = "Banco distribuido tolerante a falhas (ICMC/USP - Sistemas Distribuidos)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2"]

[project.scripts]
banco-server = "bank.server:main"
# O CLI fica fora do pacote (cli/banco_cli.py) para poder ser executado
# diretamente do repositorio: python cli/banco_cli.py <comando>

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "cli"]
timeout = 60
