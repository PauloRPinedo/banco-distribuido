server {
    listen 80;

    # O painel tem rotas (/inicio, /transferir, ...): qualquer caminho que não
    # seja um ficheiro cai no index.html, e quem decide o ecrã é o React.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # `/api/*` segue para o balanceador, que descobre o primário. O navegador
    # nunca fala diretamente com um nó.
    location /api/ {
        proxy_pass http://balanceador:8000/;
        proxy_set_header Host $host;
    }
}
