server {
    listen 80;

    # SPA: cualquier ruta que no sea un archivo cae en index.html (react-router)
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # /api/* se reenvía al balanceador — el navegador nunca le habla
    # directo a un nodo (ver diagrama-de-componentes.md).
    location /api/ {
        proxy_pass http://balanceador:8000/;
        proxy_set_header Host $host;
    }
}
