<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           font-variant-numeric: tabular-nums; background: #F4F6FB; color: #191919; }
    a { color: #1B4DB1; } a:hover { color: #14397F; }
  </style>
</helmet>
<div style="padding: 40px; display: flex; flex-direction: column; gap: 24px; min-height: 520px">
  <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Contas</span>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(25,25,25,.04), 0 4px 16px rgba(25,25,25,.04); display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 600">alice</span>
      <span style="font-size: 28px; font-weight: 400">R$ 7.475,00</span>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">criada em 14/09/2026 · 4 movimentos</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(25,25,25,.04), 0 4px 16px rgba(25,25,25,.04); display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 600">bob</span>
      <span style="font-size: 28px; font-weight: 400">R$ 4.925,00</span>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">criada em 14/09/2026 · 2 movimentos</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(25,25,25,.04), 0 4px 16px rgba(25,25,25,.04); display: flex; flex-direction: column; gap: 16px">
    <span style="font-size: 15px; font-weight: 600">Nova conta</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">identificador</span>
        <div style="background: #F4F6FB; border-radius: 12px; padding: 16px; font-size: 15px; color: #8E8E99">carla</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">saldo inicial</span>
        <div style="background: #F4F6FB; border-radius: 12px; padding: 16px; font-size: 15px; color: #8E8E99">0,00</div>
      </div>
    </div>
    <div style="background: #1B4DB1; color: #FFFFFF; font-size: 15px; padding: 16px; border-radius: 12px; text-align: center">Criar conta</div>
  </div>
</div>
</x-dc>
</body>
</html>
