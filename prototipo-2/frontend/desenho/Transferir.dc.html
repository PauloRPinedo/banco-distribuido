<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           font-variant-numeric: tabular-nums; background: #F4F6FB; color: #191919; }
    a { color: #1B4DB1; } a:hover { color: #14397F; }
  </style>
</helmet>
<div style="padding: 40px; display: flex; flex-direction: column; gap: 24px; min-height: 560px">
  <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Transferir</span>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(25,25,25,.04), 0 4px 16px rgba(25,25,25,.04); display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">de</span>
        <div style="background: #F4F6FB; border-radius: 12px; padding: 16px; font-size: 15px">alice</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">para</span>
        <div style="background: #F4F6FB; border-radius: 12px; padding: 16px; font-size: 15px">bob</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">valor</span>
        <div style="background: #F4F6FB; border-radius: 12px; padding: 16px; font-size: 28px; font-weight: 400">R$ 25,00</div>
      </div>
      <div style="background: #1B4DB1; color: #FFFFFF; font-size: 15px; padding: 16px; border-radius: 12px; text-align: center">Transferir</div>
      <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">confirmada só depois de gravada na maioria dos nós</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 24px">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(25,25,25,.04), 0 4px 16px rgba(25,25,25,.04); display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00875A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span style="font-size: 15px; font-weight: 600; color: #00875A">confirmada</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between"><span style="font-size: 15px; color: #5C5C66">alice</span><span style="font-size: 15px">R$ 7.475,00</span></div>
          <div style="display: flex; justify-content: space-between"><span style="font-size: 15px; color: #5C5C66">bob</span><span style="font-size: 15px">R$ 4.925,00</span></div>
        </div>
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #8E8E99">entrada 143 · epoch 7 · 2 de 3 nós</span>
      </div>

      <div style="background: #FDECEF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 600; color: #C4314B">saldo insuficiente</span>
        <span style="font-size: 15px; color: #C4314B">alice tem R$ 75,00 e a operação pede R$ 500,00</span>
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: #C4314B">tente um valor até R$ 75,00</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
