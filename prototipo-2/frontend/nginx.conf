server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # `/api/*` segue para o balanceador, que descobre o primário. O navegador
    # nunca fala diretamente com um nó.
    location /api/ {
        proxy_pass http://balanceador:8000/;
        proxy_set_header Host $host;
    }
}
