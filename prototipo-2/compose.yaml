# Alternativa para o laptop onde a instalação nativa do PostgreSQL se resista.
#
#   docker compose up -d
#   ./scripts/preparar_postgres.sh          # com PGHOST=localhost PGUSER=banco
#
# A versão está fixa de propósito: "postgres:latest" faria dois laptops correrem
# versões diferentes sem ninguém dar por isso, e a demonstração é em duas
# máquinas.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
      POSTGRES_DB: banco_a
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco"]
      interval: 2s
      timeout: 3s
      retries: 15
