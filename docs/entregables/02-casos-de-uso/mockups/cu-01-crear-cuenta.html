<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU-01 · Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="telefono">
    <header>
      <div class="volver">‹</div>
      <h1>Nueva cuenta</h1>
    </header>
    <main>
      <div class="tarjeta">
        <div class="campo">
          <label>Moneda de la cuenta</label>
          <select class="select-cuenta">
            <option>Real brasileño (BRL)</option>
            <option>Dólar estadounidense (USD)</option>
            <option>Sol peruano (PEN)</option>
          </select>
        </div>
        <div class="campo">
          <label>Saldo inicial</label>
          <div class="fila-monto">
            <input class="input-monto" type="text" value="0,00" inputmode="decimal">
            <div class="chip-moneda">BRL</div>
          </div>
        </div>
      </div>
      <div class="aviso">
        <span class="punto">●</span>
        <span>La cuenta queda asociada a tu usuario. Puedes tener varias cuentas, incluso en la misma moneda.</span>
      </div>
      <button class="btn-confirmar">Crear cuenta</button>
    </main>
    <footer class="tab-bar">
      <div class="tab activo"><div class="icono"></div>Inicio</div>
      <div class="tab"><div class="icono"></div>Transferir</div>
      <div class="tab"><div class="icono"></div>Extracto</div>
      <div class="tab"><div class="icono"></div>Perfil</div>
    </footer>
  </div>
</body>
</html>
