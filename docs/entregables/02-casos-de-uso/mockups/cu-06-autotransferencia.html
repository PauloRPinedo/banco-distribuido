<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU-06 · Autotransferencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="telefono">
    <header>
      <div class="volver">‹</div>
      <h1>Entre mis cuentas</h1>
    </header>
    <main>
      <div class="tarjeta">
        <div class="campo">
          <label>Desde (mi cuenta)</label>
          <select class="select-cuenta">
            <option>Cuenta corriente · R$ 1.240,00 (BRL)</option>
            <option>Cuenta USD · $ 85,00 (USD)</option>
          </select>
        </div>
        <div class="campo">
          <label>Hacia (mi cuenta)</label>
          <select class="select-cuenta">
            <option>Cuenta USD · $ 85,00 (USD)</option>
            <option>Cuenta PEN · S/ 120,00 (PEN)</option>
          </select>
        </div>
        <div class="campo">
          <label>Monto</label>
          <div class="fila-monto">
            <input class="input-monto" type="text" value="100,00" inputmode="decimal">
            <div class="chip-moneda">BRL</div>
          </div>
        </div>
      </div>

      <div class="aviso">
        <span class="punto">●</span>
        <span>Las monedas son distintas: se aplicará conversión con la tasa vigente, igual que en una transferencia a terceros.</span>
      </div>

      <button class="btn-confirmar">Mover dinero</button>
    </main>
    <footer class="tab-bar">
      <div class="tab"><div class="icono"></div>Inicio</div>
      <div class="tab activo"><div class="icono"></div>Transferir</div>
      <div class="tab"><div class="icono"></div>Extracto</div>
      <div class="tab"><div class="icono"></div>Perfil</div>
    </footer>
  </div>
</body>
</html>
