<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU-07 · Extracto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="telefono">
    <header>
      <div class="volver">‹</div>
      <h1>Extracto · Cuenta corriente</h1>
    </header>
    <main>
      <div class="lista">
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Transferencia enviada</span>
            <span class="subtitulo">a Bob · hoy 14:32</span>
          </div>
          <span class="monto negativo">− R$ 25,00</span>
        </div>
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Conversión a USD</span>
            <span class="subtitulo">tasa 1 BRL = 0,20 USD · ayer 09:10</span>
          </div>
          <span class="monto negativo">− R$ 100,00</span>
        </div>
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Depósito</span>
            <span class="subtitulo">ayer 09:00</span>
          </div>
          <span class="monto positivo">+ R$ 50,00</span>
        </div>
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Cuenta creada</span>
            <span class="subtitulo">saldo inicial · hace 3 días</span>
          </div>
          <span class="monto positivo">+ R$ 1.315,00</span>
        </div>
      </div>
    </main>
    <footer class="tab-bar">
      <div class="tab"><div class="icono"></div>Inicio</div>
      <div class="tab"><div class="icono"></div>Transferir</div>
      <div class="tab activo"><div class="icono"></div>Extracto</div>
      <div class="tab"><div class="icono"></div>Perfil</div>
    </footer>
  </div>
</body>
</html>
