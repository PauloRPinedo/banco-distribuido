<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU-02 · Consultar saldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="telefono">
    <header>
      <h1>Hola, Alice</h1>
    </header>
    <main>
      <div class="saldo-grande">
        <div class="etiqueta">Saldo total (BRL)</div>
        <div class="monto">R$ 1.240,00</div>
      </div>

      <div class="fila-acciones">
        <button class="btn-primario">Transferir</button>
        <button class="btn-secundario">Depositar</button>
      </div>

      <div class="lista">
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Cuenta corriente</span>
            <span class="subtitulo">BRL · actualizado ahora</span>
          </div>
          <span class="monto">R$ 1.240,00</span>
        </div>
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Cuenta USD</span>
            <span class="subtitulo">USD · actualizado ahora</span>
          </div>
          <span class="monto">$ 85,00</span>
        </div>
        <div class="lista-item">
          <div class="info">
            <span class="titulo">Cuenta PEN</span>
            <span class="subtitulo">PEN · actualizado ahora</span>
          </div>
          <span class="monto">S/ 120,00</span>
        </div>
      </div>
    </main>
    <footer class="tab-bar">
      <div class="tab activo"><div class="icono"></div>Inicio</div>
      <div class="tab"><div class="icono"></div>Transferir</div>
      <div class="tab"><div class="icono"></div>Extracto</div>
      <div class="tab"><div class="icono"></div>Perfil</div>
    </footer>
  </div>
</body>
</html>
