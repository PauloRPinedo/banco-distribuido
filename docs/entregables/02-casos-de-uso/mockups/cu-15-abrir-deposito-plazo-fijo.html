<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU-15 · Depósito a plazo fijo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="telefono">
    <header>
      <div class="volver">‹</div>
      <h1>Depósito a plazo fijo</h1>
    </header>
    <main>
      <div class="tarjeta">
        <div class="campo">
          <label>Moneda del depósito</label>
          <select class="select-cuenta">
            <option>Real brasileño (BRL)</option>
            <option>Dólar estadounidense (USD)</option>
            <option>Sol peruano (PEN)</option>
          </select>
        </div>
        <div class="campo">
          <label>Monto a depositar</label>
          <div class="fila-monto">
            <input class="input-monto" type="text" value="1.000,00" inputmode="decimal">
            <div class="chip-moneda">BRL</div>
          </div>
        </div>
        <div class="campo">
          <label>Plazo</label>
          <select class="select-cuenta">
            <option>30 días</option>
            <option selected>90 días</option>
            <option>180 días</option>
          </select>
        </div>
      </div>

      <div class="resumen">
        <div class="titulo-resumen">Condiciones del depósito</div>
        <div class="linea-resumen"><span>Tasa del plazo</span><strong>2,00%</strong></div>
        <div class="linea-resumen"><span>Fecha de vencimiento</span><strong>13/12/2026</strong></div>
        <div class="linea-total">
          <span class="etiqueta">Recibes al vencer</span>
          <span class="valor">R$ 1.020,00</span>
        </div>
      </div>

      <div class="aviso">
        <span class="punto">●</span>
        <span>No podrás retirar ni transferir desde este depósito antes del 13/12/2026. El interés se acredita completo en esa fecha.</span>
      </div>

      <button class="btn-confirmar">Abrir depósito a plazo fijo</button>
    </main>
    <footer class="tab-bar">
      <div class="tab activo"><div class="icono"></div>Inicio</div>
      <div class="tab"><div class="icono"></div>Transferir</div>
      <div class="tab"><div class="icono"></div>Extracto</div>
      <div class="tab"><div class="icono"></div>Perfil</div>
    </footer>
  </div>
</body>
</html>
