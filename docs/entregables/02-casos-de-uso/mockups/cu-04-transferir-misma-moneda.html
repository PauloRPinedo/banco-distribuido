<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CU-04 · Transferir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="telefono">
    <header>
      <div class="volver">‹</div>
      <h1>Transferir</h1>
    </header>
    <main>
      <div class="tarjeta">
        <div class="campo">
          <label>Cuenta origen</label>
          <select class="select-cuenta">
            <option>Cuenta corriente · R$ 1.240,00 (BRL)</option>
          </select>
        </div>
        <div class="campo">
          <label>Cuenta destino</label>
          <select class="select-cuenta">
            <option>Bob · Cuenta corriente (BRL)</option>
          </select>
        </div>
        <div class="campo">
          <label>Monto</label>
          <div class="fila-monto">
            <input class="input-monto" type="text" value="25,00" inputmode="decimal">
            <div class="chip-moneda">BRL</div>
          </div>
        </div>
      </div>

      <div class="resumen">
        <div class="linea-resumen"><span>Bob recibe</span><strong>R$ 25,00</strong></div>
        <div class="linea-resumen"><span>Sin conversión — misma moneda</span><strong>—</strong></div>
      </div>

      <button class="btn-confirmar">Confirmar transferencia</button>
    </main>
    <footer class="tab-bar">
      <div class="tab"><div class="icono"></div>Inicio</div>
      <div class="tab activo"><div class="icono"></div>Transferir</div>
      <div class="tab"><div class="icono"></div>Extracto</div>
      <div class="tab"><div class="icono"></div>Perfil</div>
    </footer>
  </div>
</body>
</html>
