server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # `/api/*` segue para o nó. Há um nó só nesta etapa, por isso o destino é
    # fixo; na etapa 2 é aqui, ou num balanceador à frente disto, que passa a
    # ser preciso descobrir qual deles é o primário.
    location /api/ {
        proxy_pass http://banco:8001/;
        proxy_set_header Host $host;
    }
}
